<script>
/* ============================================================
   THEME
   ============================================================ */
let currentTheme = 'light';
function toggleTheme() {
  currentTheme = currentTheme === 'light' ? 'dark' : 'light';
  document.documentElement.classList.toggle('dark', currentTheme === 'dark');
  document.documentElement.classList.toggle('light', currentTheme === 'light');
}
// Respect system preference on first load
if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
  toggleTheme();
}

/* ============================================================
   MODAL
   ============================================================ */
function openModal(title, htmlBody) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = htmlBody;
  const m = document.getElementById('modal');
  m.classList.remove('hidden');
  m.classList.add('flex');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  const m = document.getElementById('modal');
  m.classList.add('hidden');
  m.classList.remove('flex');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ============================================================
   STATE & ROUTING
   ============================================================ */
let state = { view: 'home', category: null, useCase: null };

function go(view, opts = {}) {
  state = { ...state, view, ...opts };
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function goHome()   { go('home', { category: null, useCase: null }); }
function goCategories() { go('categories', { category: null, useCase: null }); }
function goCategory(id) { go('category', { category: id, useCase: null }); }
function goUseCase(uc) { go('useCase', { useCase: uc }); }

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  const app = document.getElementById('app');
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = '';
  app.innerHTML = '';

  // Build breadcrumb
  const crumbs = [{ label: 'Home', action: 'goHome()' }];
  if (state.view !== 'home') crumbs.push({ label: 'Choose Business', action: 'goCategories()' });
  if (state.category) crumbs.push({ label: BUSINESSES[state.category].name, action: `goCategory('${state.category}')` });
  if (state.useCase) crumbs.push({ label: USE_CASES[state.useCase].title, action: '' });
  crumbs.forEach((c, i) => {
    const isLast = i === crumbs.length - 1;
    const sep = i > 0 ? '<svg class="w-4 h-4 text-ink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" d="M9 5l7 7-7 7"/></svg>' : '';
    bc.innerHTML += sep + (isLast || !c.action
      ? `<span class="font-medium text-ink-900 dark:text-ink-100">${c.label}</span>`
      : `<button onclick="${c.action}" class="hover:text-brand-600 dark:hover:text-brand-400 hover:underline">${c.label}</button>`);
  });

  // Render the view
  switch (state.view) {
    case 'home':       renderHome(app); break;
    case 'categories': renderCategories(app); break;
    case 'category':   renderCategory(app); break;
    case 'useCase':    renderUseCase(app); break;
  }
}

  const map = {
    'Zapier': 'A "connector" service. You pick a trigger ("when a new email arrives") and an action ("add a row to my spreadsheet"). Zapier sits between apps and shuttles data. Free tier available; paid plans start around $20/mo.',
    'Make.com': 'Like Zapier, but more visual and more powerful for the price. You build "scenarios" by dragging modules. Generally cheaper than Zapier at scale.',
    'n8n': 'Open-source alternative to Zapier and Make. You can host it yourself for free, which means total control over your data. Steeper learning curve but unlimited.',
    'ChatGPT': 'OpenAI\'s AI assistant. Best-known and very capable. ChatGPT Plus is $20/mo and gets you the smartest models, image generation, and Custom GPTs.',
    'Claude': 'Anthropic\'s AI assistant (that\'s us, hi!). Strong at writing, reasoning, and following instructions carefully. Free tier available, Pro is $20/mo.',
    'Gemini': 'Google\'s AI, deeply integrated with Gmail, Docs, Sheets, and Calendar. Great if your business already lives in Google Workspace.',
    'Google Sheets': 'Free spreadsheet that doubles as a tiny database. Most no-code AI workflows start with a Sheet as the storage layer.',
    'Airtable': 'A spreadsheet-database hybrid. Looks like Excel, behaves like a database. Great for tracking customers, jobs, inventory — and connects to AI tools cleanly.',

  return `<p>${map[name] || 'A tool in the AI ecosystem.'}</p>`;
}

/* ============================================================
   SVG WORKFLOW RENDERING
   ============================================================ */
function renderWorkflowSvg(steps) {
  const stepWidth = 160;
  const stepHeight = 100;
  const gap = 50;
  const padding = 20;
  const totalWidth = steps.length * stepWidth + (steps.length - 1) * gap + padding * 2;
  const totalHeight = stepHeight + padding * 2 + 70; // extra for label below

  const stepNodes = steps.map((s, i) => {
    const x = padding + i * (stepWidth + gap);
    const y = padding;
    return `
      <g class="workflow-step">
        <!-- Box -->
        <rect x="${x}" y="${y}" width="${stepWidth}" height="${stepHeight}" rx="12"
          fill="var(--step-bg)" stroke="var(--step-stroke)" stroke-width="2"/>
        <!-- Icon circle -->
        <circle cx="${x + 30}" cy="${y + 30}" r="18" fill="var(--icon-bg)"/>
        <g transform="translate(${x + 30 - 12}, ${y + 30 - 12})" stroke="var(--icon-color)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          ${ICONS[s.icon] || ICONS.check}
        </g>
        <!-- Step number -->
        <circle cx="${x + stepWidth - 18}" cy="${y + 18}" r="13" fill="var(--num-bg)"/>
        <text x="${x + stepWidth - 18}" y="${y + 22}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--num-color)">${i+1}</text>
        <!-- Label -->
        <text x="${x + 12}" y="${y + 70}" font-size="13" font-weight="700" fill="var(--text-color)">${truncate(s.label, 20)}</text>
        <text x="${x + 12}" y="${y + 88}" font-size="11" fill="var(--muted-color)">${truncate(s.detail, 24)}</text>
      </g>
    `;
  }).join('');

  const arrows = steps.slice(0, -1).map((_, i) => {
    const x1 = padding + (i + 1) * stepWidth + i * gap;
    const x2 = x1 + gap;
    const y = padding + stepHeight / 2;
    return `
      <line x1="${x1 + 4}" y1="${y}" x2="${x2 - 8}" y2="${y}"
        stroke="var(--arrow-color)" stroke-width="2.5" stroke-linecap="round"
        class="flow-arrow" marker-end="url(#arrowhead)"/>
    `;
  }).join('');

  return `
    <style>
      .workflow-step rect { transition: transform 0.2s; }
      :root {
        --step-bg: #ffffff; --step-stroke: #cbd5e1;
        --icon-bg: #dbeafe; --icon-color: #1d4ed8;
        --num-bg: #2563eb; --num-color: #ffffff;
        --text-color: #0f172a; --muted-color: #475569;
        --arrow-color: #64748b;
      }
      .dark {
        --step-bg: #1e293b; --step-stroke: #334155;
        --icon-bg: #1e3a8a; --icon-color: #93c5fd;
        --num-bg: #3b82f6; --num-color: #ffffff;
        --text-color: #f1f5f9; --muted-color: #94a3b8;
        --arrow-color: #94a3b8;
      }
    </style>
    <svg viewBox="0 0 ${totalWidth} ${totalHeight}" width="${totalWidth}" height="${totalHeight}" role="img" aria-label="Workflow diagram showing ${steps.length} steps">
      <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
          <polygon points="0 0, 10 5, 0 10" fill="var(--arrow-color)"/>
        </marker>
      </defs>
      ${arrows}
      ${stepNodes}
    </svg>
  `;
}

function renderWorkflowVertical(steps) {
  return `
    <ol class="space-y-3">
      ${steps.map((s, i) => `
        <li class="flex gap-3">
          <div class="shrink-0 flex flex-col items-center">
            <div class="w-10 h-10 rounded-full bg-brand-600 text-white flex items-center justify-center font-bold shadow-md">${i+1}</div>
            ${i < steps.length - 1 ? '<div class="w-0.5 flex-1 bg-brand-300 dark:bg-brand-700 mt-1 min-h-[20px]"></div>' : ''}
          </div>
          <div class="flex-1 pb-3">
            <div class="bg-ink-50 dark:bg-ink-800/60 border border-ink-200 dark:border-ink-700 rounded-lg p-3">
              <div class="flex items-center gap-2 mb-1">
                <div class="w-7 h-7 rounded-lg bg-brand-100 dark:bg-brand-950 flex items-center justify-center text-brand-700 dark:text-brand-300">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    ${ICONS[s.icon] || ICONS.check}
                  </svg>
                </div>
                <h4 class="font-semibold">${s.label}</h4>
              </div>
              <p class="text-sm text-ink-600 dark:text-ink-300">${s.detail}</p>
            </div>
          </div>
        </li>
      `).join('')}
    </ol>
  `;
}

function truncate(s, n) {
  return s.length > n ? s.slice(0, n - 1) + '…' : s;
}

/* ============================================================
   INIT
   ============================================================ */
render();
</script>
